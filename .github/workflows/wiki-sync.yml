name: Sync Documentation to Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "docs/*.md"
      - "scripts/sync-wiki.mjs"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Synchronize docs/ to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GitHub Wiki is enabled
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          if ! git ls-remote "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" HEAD >/dev/null 2>&1; then
            echo "::error::GitHub Wiki is not enabled or cannot be accessed."
            echo "Enable the repository Wiki first, then re-run this workflow."
            exit 1
          fi

      - name: Detect Wiki default branch
        id: wiki
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git"
          wiki_branch="$(git ls-remote --symref "$wiki_url" HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}')"
          if [ -z "$wiki_branch" ]; then
            echo "::error::Could not determine the Wiki default branch."
            exit 1
          fi
          echo "branch=$wiki_branch" >> "$GITHUB_OUTPUT"

      - name: Clone Wiki repository
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch "${{ steps.wiki.outputs.branch }}" \
            "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" .wiki

      - name: Generate Wiki pages
        run: node scripts/sync-wiki.mjs docs .wiki

      - name: Commit and push Wiki changes
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          cd .wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git add -A
          git commit -m "docs: sync WebRadio documentation"
          git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" \
            "HEAD:${{ steps.wiki.outputs.branch }}"
