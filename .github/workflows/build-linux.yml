name: Build Linux (AppImage + Arch)

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Renderer bauen
        run: npm run build

      - name: Linux AppImage bauen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_CHANNEL: beta
        run: npx electron-builder --linux AppImage --x64 --publish=never

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: webradio-linux-appimage
          path: |
            dist/*.AppImage
            dist/latest*.yml
            dist/latest*.json
            dist/*.blockmap
          if-no-files-found: error

  arch-package:
    name: Build Arch Linux Package (.pkg.tar.zst)
    needs: appimage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Wir bauen das Arch-Paket in einem offiziellen Arch-Linux-Container.
      # Der WebRadio-Build selbst (AppImage) wurde bereits im vorherigen
      # Job erzeugt und wird hier heruntergeladen und eingebettet.
      - name: AppImage herunterladen
        uses: actions/download-artifact@v4
        with:
          name: webradio-linux-appimage
          path: dist

      - name: PKGBUILD und Quellen vorbereiten
        run: |
          set -euo pipefail
          mkdir -p dist/arch-build

          # ── Versionen strikt getrennt ──────────────────────────────────────
          #   SEMVER      = SemVer aus package.json  (1.0.7-alpha.5)  → Artefakt
          #   PKGVER_ARCH = Arch-Paketversion        (1.0.7.alpha.5)  → pkgver
          # Der AppImage-Dateiname wird NICHT aus einer Version rekonstruiert.
          SEMVER="$(node -p "require('./package.json').version")"
          PKGVER_ARCH="${SEMVER//-/.}"

          # Tatsächliches AppImage-Artefakt ermitteln (genau eines erwartet).
          mapfile -t APPIMAGES < <(find dist -maxdepth 1 -type f -name '*.AppImage' -print)
          if [ "${#APPIMAGES[@]}" -ne 1 ]; then
            echo "::error::Genau ein AppImage-Artefakt erwartet, gefunden: ${#APPIMAGES[@]}"
            printf '  %s\n' "${APPIMAGES[@]}"
            exit 1
          fi
          APPIMAGE_FILE="$(basename "${APPIMAGES[0]}")"
          echo "AppImage-Artefakt: ${APPIMAGE_FILE}"

          # Artefakt unverändert (gleicher Dateiname) ins Build-Verzeichnis legen.
          cp "${APPIMAGES[0]}" "dist/arch-build/${APPIMAGE_FILE}"
          chmod +x "dist/arch-build/${APPIMAGE_FILE}"

          cp assets/webradio.desktop dist/arch-build/
          cp assets/icons/tray.png dist/arch-build/

          {
            echo "SEMVER=${SEMVER}"
            echo "PKGVER_ARCH=${PKGVER_ARCH}"
            echo "APPIMAGE_FILE=${APPIMAGE_FILE}"
          } >> "$GITHUB_ENV"

      - name: PKGBUILD aus Template rendern
        run: |
          set -euo pipefail
          cd dist/arch-build

          APP_SHA="$(sha256sum "${APPIMAGE_FILE}" | awk '{print $1}')"
          DESK_SHA="$(sha256sum webradio.desktop | awk '{print $1}')"
          ICON_SHA="$(sha256sum tray.png | awk '{print $1}')"

          # __PKGVER__        = Arch-Paketversion (ohne Bindestriche)
          # __SEMVER__        = Original-SemVer (nur pkgdesc/Anzeige)
          # __APPIMAGE_FILE__ = tatsächlicher Dateiname des AppImage-Artefakts
          sed \
            -e "s|__PKGVER__|${PKGVER_ARCH}|g" \
            -e "s|__SEMVER__|${SEMVER}|g" \
            -e "s|__APPIMAGE_FILE__|${APPIMAGE_FILE}|g" \
            -e "s|__APPIMAGE_SHA256__|${APP_SHA}|g" \
            -e "s|__DESKTOP_SHA256__|${DESK_SHA}|g" \
            -e "s|__ICON_SHA256__|${ICON_SHA}|g" \
            ../../packaging/arch/PKGBUILD \
            > PKGBUILD

          echo "--- PKGBUILD (Kopf) ---"
          head -n 50 PKGBUILD

          # Sicherheitsnetz: kein unersetzter Platzhalter darf in den Build.
          if grep -n '__[A-Z][A-Z_]*__' PKGBUILD; then
            echo "::error::Unersetzte Platzhalter im gerenderten PKGBUILD."
            exit 1
          fi

          # Der AppImage-Name im PKGBUILD muss dem vorhandenen Artefakt entsprechen.
          if [ ! -f "${APPIMAGE_FILE}" ]; then
            echo "::error::AppImage-Artefakt fehlt im Build-Verzeichnis: ${APPIMAGE_FILE}"
            exit 1
          fi

      - name: Arch-Paket im Container bauen
        run: |
          docker run --rm \
            -v "$PWD/dist/arch-build:/work" \
            -w /work \
            archlinux:latest \
            bash -lc "
              set -euo pipefail
              pacman -Sy --noconfirm base-devel fakeroot squashfs-tools unzip
              useradd -m builder
              chown -R builder:builder /work
              # --nodeps: Runtime-Deps m\u00fcssen im Container NICHT installiert sein.
              # makepkg kopiert lokale Source-Dateien aus /work in srcdir.
              sudo -u builder bash -c 'cd /work && SRCDEST=/work makepkg --nodeps --noconfirm'
            "

      - name: Ergebnis-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: webradio-linux-arch
          path: dist/arch-build/*.pkg.tar.zst
          if-no-files-found: error

  arch-install-validation:
    name: Arch Linux – Paketinstallation und Permissions-Audit
    needs: arch-package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Arch-Paket herunterladen
        uses: actions/download-artifact@v4
        with:
          name: webradio-linux-arch
          path: dist/arch-build

      - name: Paket in Arch-Linux-Container installieren und prüfen
        # Verwendet den offiziellen Arch-Linux-Container (archlinux:latest).
        # Der --privileged-Flag ist für FUSE-Mounts durch AppImage-Extraktion
        # innerhalb des Containers nicht nötig – das Paket wird direkt installiert.
        run: |
          docker run --rm \
            -v "$PWD/dist/arch-build:/pkg" \
            archlinux:latest \
            bash -lc '
              set -euo pipefail

              # ── Paket installieren ──────────────────────────────────────────
              pacman -Sy --noconfirm
              # Runtime-Abhängigkeiten für den Audit installieren
              pacman -S --noconfirm \
                at-spi2-core alsa-lib cairo dbus expat gcc-libs glib2 gtk3 \
                hicolor-icon-theme libcups libdrm libnotify libsecret libx11 \
                libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon \
                libxrandr mesa nspr nss pango xdg-utils xorg-server-xvfb 2>/dev/null || true

              PKG=$(ls /pkg/*.pkg.tar.zst | head -n1)
              if [ -z "$PKG" ]; then
                echo "::error::Kein .pkg.tar.zst gefunden"
                exit 1
              fi
              echo "Installiere Paket: $PKG"
              pacman -U --noconfirm "$PKG"

              # ── Installationspfad ermitteln ────────────────────────────────
              INSTDIR="/opt/webradio"
              if [ ! -d "$INSTDIR" ]; then
                echo "::error::Installationsverzeichnis $INSTDIR nicht gefunden"
                exit 1
              fi

              echo ""
              echo "=== Permissions-Audit ==="

              echo ""
              echo "=== Installationsverzeichnis ==="
              ls -la "$INSTDIR"
              echo "Kandidaten:"
              find "$INSTDIR" -maxdepth 2 \( -name "webradio" -o -name "WebRadio" \) -print

              # Hauptbinary (webradio oder WebRadio) muss 755 haben
              MAIN_BIN=""
              for candidate in webradio WebRadio; do
                if [ -f "$INSTDIR/$candidate" ]; then
                  MAIN_BIN="$candidate"
                  break
                fi
              done
              if [ -z "$MAIN_BIN" ]; then
                echo "::error::Hauptbinary nicht gefunden in $INSTDIR"
                exit 1
              fi
              MAIN_MODE=$(stat -c "%a" "$INSTDIR/$MAIN_BIN")
              echo "Hauptbinary $MAIN_BIN: $MAIN_MODE"
              if [ "$MAIN_MODE" != "755" ]; then
                echo "::error::Hauptbinary muss 755 haben, ist: $MAIN_MODE"
                exit 1
              fi

              # chrome-sandbox muss 4755 (SUID) haben
              if [ -f "$INSTDIR/chrome-sandbox" ]; then
                SANDBOX_MODE=$(stat -c "%a" "$INSTDIR/chrome-sandbox")
                echo "chrome-sandbox: $SANDBOX_MODE"
                if [ "$SANDBOX_MODE" != "4755" ]; then
                  echo "::error::chrome-sandbox muss 4755 haben, ist: $SANDBOX_MODE"
                  exit 1
                fi
              else
                echo "::warning::chrome-sandbox nicht gefunden (kann bei manchen Electron-Versionen fehlen)"
              fi

              # chrome_crashpad_handler muss 755 haben
              if [ -f "$INSTDIR/chrome_crashpad_handler" ]; then
                CRASHPAD_MODE=$(stat -c "%a" "$INSTDIR/chrome_crashpad_handler")
                echo "chrome_crashpad_handler: $CRASHPAD_MODE"
                if [ "$CRASHPAD_MODE" != "755" ]; then
                  echo "::error::chrome_crashpad_handler muss 755 haben, ist: $CRASHPAD_MODE"
                  exit 1
                fi
              fi

              # Shared Libraries (.so) dürfen NICHT ausführbar sein (kein x-Bit)
              echo ""
              echo "=== Shared-Library Permissions (.so darf nicht ausführbar sein) ==="
              FAIL=0
              while IFS= read -r -d "" sofile; do
                MODE=$(stat -c "%a" "$sofile")
                # x-Bit: 1,3,5,7 in der Einerstelle (owner/group/other)
                OWNER_X=$(( (8#$MODE >> 6) & 1 ))
                if [ "$OWNER_X" -eq 1 ]; then
                  echo "::error::Shared library hat unerwartet execute-Bit (Owner): $sofile ($MODE)"
                  FAIL=1
                fi
              done < <(find "$INSTDIR" -type f \( -name "*.so" -o -name "*.so.*" \) -print0)
              if [ "$FAIL" -ne 0 ]; then
                exit 1
              fi
              echo "Alle Shared Libraries korrekt (644 / nicht ausführbar)."

              # Desktop-Datei und Icon-Symlink prüfen
              echo ""
              echo "=== Desktop-Integration ==="
              if [ ! -f "/usr/share/applications/webradio.desktop" ]; then
                echo "::error::.desktop-Datei fehlt in /usr/share/applications/"
                exit 1
              fi
              echo "webradio.desktop: OK"

              if [ ! -L "/usr/bin/webradio" ] && [ ! -f "/usr/bin/webradio" ]; then
                echo "::error::/usr/bin/webradio Symlink fehlt"
                exit 1
              fi
              echo "/usr/bin/webradio: OK"

              # ── Headless Smoke-Test (Electron --version) ───────────────────
              # Ein vollständiger GUI-Start ist in einer Container-CI-Umgebung
              # ohne X11/Wayland-Display nicht möglich. Wir prüfen stattdessen:
              #  1. Dass der Electron-Prozess startet und die Version ausgibt.
              #  2. Dass chrome-sandbox korrekt als SUID konfiguriert ist
              #     (Electron prüft dies beim Start und bricht mit FATAL ab).
              echo ""
              echo "=== Headless Smoke-Test ==="
              export DISPLAY=:99
              # Virtual-Framebuffer für minimale GUI-Initialisierung
              Xvfb :99 -screen 0 1024x768x24 &
              XVFB_PID=$!
              sleep 1

              # Electron mit --version: validiert, dass die Binary startet
              # und die Sandbox nicht sofort mit FATAL abbricht.
              # `timeout` verhindert, dass ein haengender Prozess den Job blockiert.
              ELECTRON_VERSION=$(timeout 30 /usr/bin/webradio --version --no-sandbox 2>&1 || true)
              echo "Electron --version Ausgabe: $ELECTRON_VERSION"

              # Prüfen ob chrome-sandbox FATAL-Fehler aufgetreten ist
              SANDBOX_CHECK=$(timeout 30 /usr/bin/webradio --version 2>&1 || true)
              # Der Hinweis "Running as root without --no-sandbox" ist in CI-Containern
              # (Lauf als root) zu erwarten und kein echter chrome-sandbox-Fehler.
              # Die SUID-Konfiguration der chrome-sandbox (4755) wird separat geprueft.
              if echo "$SANDBOX_CHECK" | grep -qi "FATAL.*sandbox" && \
                 ! echo "$SANDBOX_CHECK" | grep -qi "Running as root"; then
                echo "::error::Sandbox FATAL-Fehler beim Start: $SANDBOX_CHECK"
                kill "$XVFB_PID" 2>/dev/null || true
                exit 1
              fi
              echo "Kein Sandbox FATAL-Fehler detektiert."

              kill "$XVFB_PID" 2>/dev/null || true
              wait "$XVFB_PID" 2>/dev/null || true
              echo ""
              echo "=== Alle Prüfungen bestanden ==="
            '
