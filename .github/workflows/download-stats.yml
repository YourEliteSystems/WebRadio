name: Update Download Statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Refresh Release Download Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Generate Statistics
        run: node scripts/release/download-stats.js

      - name: Commit Updated Statistics
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/downloads.json docs/DOWNLOAD_STATS.md; then
            echo "Keine Änderungen an den Download-Statistiken."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads.json docs/DOWNLOAD_STATS.md
          git commit -m "docs: update release download statistics"
          git push
