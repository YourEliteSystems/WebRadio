name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  release:

    name: Build & Release

    runs-on: windows-latest

    timeout-minutes: 45

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Release
        run: node scripts/release

      - name: Build Renderer
        run: npm run build

      - name: Build Electron Application
        run: npm run dist

      - name: Generate Checksums
        run: node scripts/release/checksums.js

      - name: Generate Release Notes
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const releaseNotes=require('./scripts/release/release-notes'); const pkg=require('./package.json'); fs.writeFileSync('release-notes.md', releaseNotes.generate(pkg.version));"

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts

          Get-ChildItem -Path dist -File |
            Copy-Item -Destination release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: release-notes.md
          files:
            - release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}