name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Trigger
#
#   Automatisch: Jeder Git-Tag der Form v* startet die Pipeline.
#   Manuell:     workflow_dispatch als Backup-/Notfall-Trigger.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version (optional, z.B. v1.0.5-rc.4). Muss mit package.json uebereinstimmen.'
        required: false
        default: ''
      draft:
        description: 'Release als Entwurf veroeffentlichen?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# ─────────────────────────────────────────────────────────────────────────────
# Berechtigungen
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Release-Kontext bestimmen
  #
  # Wird von beiden Build-Jobs (Windows & Linux) als Quelle genutzt.
  # Outputs: release_tag, release_version, is_prerelease, update_channel
  # ───────────────────────────────────────────────────────────────────────────
  context:
    name: Resolve Release Context
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      release_tag:     ${{ steps.ctx.outputs.release_tag }}
      release_version: ${{ steps.ctx.outputs.release_version }}
      is_prerelease:   ${{ steps.ctx.outputs.is_prerelease }}
      update_channel:  ${{ steps.ctx.outputs.update_channel }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Context
        id: ctx
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"

          # Ermittle den Tag
          TAG=""
          if [[ "${GITHUB_REF}" =~ ^refs/tags/(.+)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
            echo "Trigger: Tag-Push -> $TAG"
          elif [[ -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
            echo "Trigger: workflow_dispatch mit Version -> $TAG"
          else
            TAG="v${PKG_VERSION}"
            echo "Trigger: workflow_dispatch ohne Version -> Fallback auf package.json -> $TAG"
          fi

          VERSION="${TAG#v}"

          echo "RELEASE_TAG     = $TAG"
          echo "RELEASE_VERSION = $VERSION"
          echo "PACKAGE_VERSION = $PKG_VERSION"

          # Warnung falls Tag und package.json nicht uebereinstimmen
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "::warning::Release-Tag '$TAG' stimmt nicht mit package.json '$PKG_VERSION' ueberein."
          fi

          # Pre-release erkennen (alpha, beta, rc, nightly)
          IS_PRERELEASE="false"
          if [[ "$VERSION" =~ -(alpha|beta|rc|nightly)(\.[0-9]+)?$ ]]; then
            IS_PRERELEASE="true"
          fi
          echo "IS_PRERELEASE   = $IS_PRERELEASE"

          # Update-Channel
          UPDATE_CHANNEL="latest"
          if [[ "$VERSION" =~ -beta(\.|$) ]]; then
            UPDATE_CHANNEL="beta"
          fi
          echo "UPDATE_CHANNEL  = $UPDATE_CHANNEL"

          # Outputs setzen
          echo "release_tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "update_channel=$UPDATE_CHANNEL" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Windows Build (NSIS Installer + Portable)
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: context
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Release
        run: node -e "const validate = require('./scripts/release/validate'); validate();"

      - name: Build Renderer
        run: npm run build

      - name: Build Electron Application (Windows)
        env:
          UPDATE_CHANNEL: ${{ needs.context.outputs.update_channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish=never

      - name: Generate Checksums
        run: node scripts/release/checksums.js

      - name: Prepare Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

          $include = @(
            '.exe', '.zip', '.7z', '.blockmap',
            '.txt', '.yml', '.yaml', '.json'
          )

          $exclude = @(
            'builder-debug.json',
            'builder-effective-config.yaml'
          )

          Get-ChildItem -Path dist -File | Where-Object {
            if ($exclude -contains $_.Name) { return $false }
            foreach ($ext in $include) {
              if ($_.Name.EndsWith($ext)) { return $true }
            }
            return $false
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination release-artifacts
            Write-Host "  Kopiert: $($_.Name)"
          }

          Write-Host ""
          Write-Host "Windows Artefakte:"
          Get-ChildItem release-artifacts | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-artifacts/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Linux Build (AppImage + Arch .pkg.tar.zst)
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Renderer
        run: npm run build

      - name: Build Linux AppImage
        env:
          UPDATE_CHANNEL: ${{ needs.context.outputs.update_channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --x64 --publish=never

      - name: Generate Checksums (Linux)
        run: node scripts/release/checksums.js

      - name: Build Arch Linux Package (.pkg.tar.zst)
        run: |
          set -euo pipefail
          mkdir -p dist/arch-build

          APPIMAGE_SRC="$(ls dist/*.AppImage | head -n1)"
          # SemVer aus package.json (z.B. "1.0.6-beta.2") – wird für Dateinamen genutzt
          SEMVER="$(node -p "require('./package.json').version")"
          # Arch pkgver darf KEINE Bindestriche enthalten → ersetze durch Punkte
          PKGVER_ARCH="${SEMVER//-/.}"

          # AppImage mit Original-SemVer-Namen ablegen (Dateiname bleibt)
          cp "$APPIMAGE_SRC" "dist/arch-build/webradio-${SEMVER}.AppImage"
          chmod +x "dist/arch-build/webradio-${SEMVER}.AppImage"

          cp assets/webradio.desktop dist/arch-build/
          cp assets/icons/tray.png dist/arch-build/

          cd dist/arch-build

          # Checksums berechnen
          APP_SHA="$(sha256sum "webradio-${SEMVER}.AppImage" | awk '{print $1}')"
          DESK_SHA="$(sha256sum webradio.desktop | awk '{print $1}')"
          ICON_SHA="$(sha256sum tray.png | awk '{print $1}')"

          # PKGBUILD aus Template rendern
          # __PKGVER__ = Arch-kompatible Version (ohne Bindestrich)
          # __SEMVER__  = Original SemVer (für Dateinamen und pkgdesc)
          sed \
            -e "s|__PKGVER__|${PKGVER_ARCH}|g" \
            -e "s|__SEMVER__|${SEMVER}|g" \
            -e "s|__APPIMAGE_SHA256__|${APP_SHA}|g" \
            -e "s|__DESKTOP_SHA256__|${DESK_SHA}|g" \
            -e "s|__ICON_SHA256__|${ICON_SHA}|g" \
            ../../packaging/arch/PKGBUILD \
            > PKGBUILD

          echo "--- PKGBUILD (head) ---"
          head -n 45 PKGBUILD

          # makepkg benötigt die Source-Dateien im selben Verzeichnis.
          # (PKGBUILD referenziert sie ohne file://, d.h. makepkg sucht
          #  sie im SRCDEST = Arbeitsverzeichnis des Containers)
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash -lc "
              set -euo pipefail
              pacman -Sy --noconfirm base-devel fakeroot squashfs-tools unzip
              useradd -m builder
              chown -R builder:builder /work
              # SRCDEST auf das Arbeitsverzeichnis setzen, damit makepkg
              # die Source-Dateien direkt dort findet (kein Download nötig)
              sudo -u builder bash -c 'cd /work && SRCDEST=/work makepkg --noextract --nodeps -s --noconfirm || SRCDEST=/work makepkg -s --noconfirm'
            "

      - name: Prepare Linux Artifacts
        run: |
          mkdir -p release-artifacts

          # AppImage + Metadaten aus dist/
          find dist -maxdepth 1 -type f \( \
            -name "*.AppImage" \
            -o -name "*.blockmap" \
            -o -name "latest*.yml" \
            -o -name "beta*.yml" \
            -o -name "latest*.json" \
            -o -name "*.txt" \
          \) | while read f; do
            cp "$f" release-artifacts/
            echo "  Kopiert: $(basename "$f")"
          done

          # Arch-Paket
          find dist/arch-build -maxdepth 1 -name "*.pkg.tar.zst" | while read f; do
            cp "$f" release-artifacts/
            echo "  Kopiert: $(basename "$f")"
          done

          echo ""
          echo "Linux Artefakte:"
          ls -lh release-artifacts/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-artifacts/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4: Release Notes erzeugen
  # ───────────────────────────────────────────────────────────────────────────
  release-notes:
    name: Generate Release Notes
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Release Notes
        env:
          RELEASE_VERSION: ${{ needs.context.outputs.release_version }}
        run: |
          node -e "
            const fs = require('fs');
            const releaseNotes = require('./scripts/release/release-notes');
            const notes = releaseNotes.generate(process.env.RELEASE_VERSION);
            fs.writeFileSync('release-notes.md', notes, 'utf8');
            console.log('Release Notes erzeugt fuer Version ' + process.env.RELEASE_VERSION);
          "

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Job 5: GitHub Release veroeffentlichen
  #
  # Wartet auf beide Build-Jobs und die Release-Notes.
  # Laedt alle Artefakte (Windows + Linux) in denselben GitHub-Release hoch.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [context, build-windows, build-linux, release-notes]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-artifacts

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-artifacts

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: List all Release Artifacts
        run: |
          echo "Alle Artefakte fuer den Release:"
          ls -lh release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ needs.context.outputs.release_tag }}
          name:                   WebRadio ${{ needs.context.outputs.release_version }}
          body_path:              release-notes.md
          prerelease:             ${{ needs.context.outputs.is_prerelease }}
          draft:                  ${{ inputs.draft || 'false' }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}