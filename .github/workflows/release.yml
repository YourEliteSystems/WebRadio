name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Trigger
#
#   Automatisch: Jeder Git-Tag der Form v* startet die Pipeline.
#   Manuell:     workflow_dispatch als Backup-/Notfall-Trigger.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version (optional, z.B. v1.0.5-rc.4). Muss mit package.json übereinstimmen.'
        required: false
        default: ''
      draft:
        description: 'Release als Entwurf veröffentlichen?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# ─────────────────────────────────────────────────────────────────────────────
# Berechtigungen
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write
  actions: read

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Release-Kontext bestimmen
  #
  # Wird von beiden Build-Jobs (Windows & Linux) als Quelle genutzt.
  # Outputs: release_tag, release_version, is_prerelease, update_channel
  # ───────────────────────────────────────────────────────────────────────────
  context:
    name: Resolve Release Context
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      release_tag:     ${{ steps.ctx.outputs.release_tag }}
      release_version: ${{ steps.ctx.outputs.release_version }}
      is_prerelease:   ${{ steps.ctx.outputs.is_prerelease }}
      update_channel:  ${{ steps.ctx.outputs.update_channel }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Context
        id: ctx
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [[ -z "$PKG_VERSION" ]]; then
            echo "::error::package.json konnte nicht gelesen werden (kein Feld 'version')."
            exit 1
          fi

          # Ermittle den Tag
          TAG=""
          if [[ "${GITHUB_REF}" =~ ^refs/tags/(.+)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
            echo "Trigger: Tag-Push -> $TAG"
          elif [[ -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
            echo "Trigger: workflow_dispatch mit Version -> $TAG"
          else
            TAG="v${PKG_VERSION}"
            echo "Trigger: workflow_dispatch ohne Version -> Fallback auf package.json -> $TAG"
          fi

          VERSION="${TAG#v}"

          echo "RELEASE_TAG     = $TAG"
          echo "RELEASE_VERSION = $VERSION"
          echo "PACKAGE_VERSION = $PKG_VERSION"

          # Version must match package.json exactly
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Release-Tag '$TAG' stimmt nicht mit package.json '$PKG_VERSION' überein."
            exit 1
          fi

          # Valid SemVer
          if ! node -e "
            const semver = require('./scripts/release/semver');
            if (!semver.isValid(process.argv[1])) {
              console.error('::error::\"%s\" ist kein gültiges Semantic Version.', process.argv[1]);
              process.exit(1);
            }
          " "$VERSION"; then
            exit 1
          fi

          # Pre-release recognition
          IS_PRERELEASE="false"
          if [[ "$VERSION" =~ -(alpha|beta|rc|nightly)(\.[0-9]+)?$ ]]; then
            IS_PRERELEASE="true"
          fi
          echo "IS_PRERELEASE   = $IS_PRERELEASE"

          # Update channel
          #   latest, beta, alpha
          #   rc and nightly are treated as release-eligible channels, but NOT
          #   forwarded to electron-builder as non-latest update channels because
          #   the existing electron-builder.yml currently defines only latest/beta.
          UPDATE_CHANNEL="latest"
          if [[ "$VERSION" =~ -beta(\.|$) ]]; then
            UPDATE_CHANNEL="beta"
          fi
          if [[ "$VERSION" =~ -alpha(\.|$) ]]; then
            UPDATE_CHANNEL="alpha"
          fi

          if [[ "$VERSION" =~ -(rc|nightly)(\.|$) ]]; then
            # Release notes / GitHub pre-release still apply, but keep electron-updater
            # channel on latest unless the publish config is extended explicitly.
            UPDATE_CHANNEL="latest"
          fi

          echo "UPDATE_CHANNEL  = $UPDATE_CHANNEL"

          # Outputs setzen
          echo "release_tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "update_channel=$UPDATE_CHANNEL" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Windows Build (NSIS Installer + Portable)
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: context
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Clean Dist Directory
        run: rm -rf dist

      - name: Install Dependencies
        run: npm ci

      - name: Validate Release
        run: node -e "const validate = require('./scripts/release/validate'); validate();"

      - name: Build Renderer
        run: npm run build

      - name: Build Electron Application (Windows)
        env:
          UPDATE_CHANNEL: ${{ needs.context.outputs.update_channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish=never

      - name: Ensure Windows Update Metadata Files
        shell: pwsh
        env:
          UPDATE_CHANNEL: ${{ needs.context.outputs.update_channel }}
        run: |
          Write-Host "UPDATE_CHANNEL = ${{ env.UPDATE_CHANNEL }}"

          $ymlFiles = Get-ChildItem -Path dist -Filter '*.yml' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^latest.*\.yml$' -or $_.Name -match '^beta.*\.yml$' }

          Write-Host "YAML-Dateien in dist/:"
          if ($ymlFiles.Count -eq 0) {
            Write-Host "  (keine Update-YAMLs gefunden)"
          }
          foreach ($f in $ymlFiles) {
            Write-Host "  $($f.Name)"
          }

          # electron-builder erzeugt Update-YAMLs pro Channel. Keine künstliche
          # Kopie zwischen latest.yml / beta.yml mehr, da das Stable- und Beta-Metadaten
          # vermischen würde.
          $expectedForChannel = @()
          if ($env.UPDATE_CHANNEL -eq 'beta') {
            $expectedForChannel = @('beta.yml', 'beta-linux.yml')
          } elseif ($env.UPDATE_CHANNEL -eq 'alpha') {
            $expectedForChannel = @('alpha.yml', 'alpha-linux.yml')
          } else {
            $expectedForChannel = @('latest.yml', 'latest-linux.yml')
          }

          foreach ($expected in $expectedForChannel) {
            if (Test-Path "dist/$expected") {
              Write-Host "  Erwartete Datei vorhanden: $expected"
            } else {
              Write-Host "::warning::$expected fehlt im dist/-Verzeichnis (Channel: $env.UPDATE_CHANNEL)"
            }
          }

      - name: Prepare Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

          $include = @(
            '.exe', '.zip', '.7z', '.blockmap',
            '.txt', '.yml', '.yaml', '.json'
          )

          $exclude = @(
            'builder-debug.json',
            'builder-effective-config.yaml',
            'SHA256SUMS.txt'
          )

          Get-ChildItem -Path dist -File | Where-Object {
            if ($exclude -contains $_.Name) { return $false }
            foreach ($ext in $include) {
              if ($_.Name.EndsWith($ext)) { return $true }
            }
            return $false
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination release-artifacts
            Write-Host "  Kopiert: $($_.Name)"
          }

          Write-Host ""
          Write-Host "Windows Artefakte:"
          Get-ChildItem release-artifacts | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Validate Windows Artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release-artifacts -File
          if ($files.Count -eq 0) {
            Write-Error "Keine Windows Release-Artefakte gefunden."
            exit 1
          }

          $expectedExtensions = @('.exe', '.zip', '.7z', '.blockmap', '.txt', '.yml', '.yaml', '.json')
          $foundAnyExpected = $false
          foreach ($f in $files) {
            foreach ($ext in $expectedExtensions) {
              if ($f.Name.EndsWith($ext)) {
                $foundAnyExpected = $true
                break
              }
            }
          }

          if (-not $foundAnyExpected) {
            Write-Error "Windows Release-Artefakte wurden hochgeladen, aber keine erwarteten Erweiterungen (.exe/.zip/.7z/.blockmap/.txt/.yml/.yaml/.json) gefunden."
            exit 1
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-artifacts/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Linux Build (AppImage + Arch .pkg.tar.zst)
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Clean Dist Directory
        run: rm -rf dist

      - name: Install Dependencies
        run: npm ci

      - name: Build Renderer
        run: npm run build

      - name: Build Linux AppImage
        env:
          UPDATE_CHANNEL: ${{ needs.context.outputs.update_channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --x64 --publish=never

      # ─────────────────────────────────────────────────────────────────────
      # Ensure Linux Update Metadata Files
      #
      # electron-builder erzeugt die Update-YAMLs/JSOLN je nach Channel.
      # Wir vermeiden künstliches Kopieren zwischen latest-linux.yml und
      # beta-linux.yml, weil das Stable- und Beta-Metadaten vermischen würde.
      # ─────────────────────────────────────────────────────────────────────
      - name: Ensure Linux Update Metadata Files
        env:
          UPDATE_CHANNEL: ${{ needs.context.outputs.update_channel }}
        run: |
          set -euo pipefail

          echo "UPDATE_CHANNEL = $UPDATE_CHANNEL"

          echo "YAML/JSON-Dateien in dist/:"
          if compgen -G 'dist/*.y*ml' > /dev/null; then
            ls -1 dist/*.yml dist/*.yaml 2>/dev/null || true
          else
            echo "  (keine .yml/.yaml Dateien gefunden)"
          fi

          expected_for_channel=()
          if [[ "$UPDATE_CHANNEL" == "beta" ]]; then
            expected_for_channel=(beta-linux.yml beta-linux.json)
          elif [[ "$UPDATE_CHANNEL" == "alpha" ]]; then
            expected_for_channel=(alpha-linux.yml alpha-linux.json)
          else
            expected_for_channel=(latest-linux.yml latest-linux.json)
          fi

          for expected in "${expected_for_channel[@]}"; do
            if [ -f "dist/$expected" ]; then
              echo "  Erwartete Datei vorhanden: $expected"
            else
              echo "::warning::$expected fehlt im dist/-Verzeichnis (Channel: $UPDATE_CHANNEL)"
            fi
          done

      - name: Build Arch Linux Package (.pkg.tar.zst)
        run: |
          set -euo pipefail
          mkdir -p dist/arch-build

          APPIMAGE_SRC="$(ls dist/*.AppImage | head -n1)"
          # SemVer aus package.json (z.B. "1.0.6-beta.2") – wird für Dateinamen genutzt
          SEMVER="$(node -p "require('./package.json').version")"
          # Arch pkgver darf KEINE Bindestriche enthalten → ersetze durch Punkte
          PKGVER_ARCH="${SEMVER//-/.}"

          # AppImage mit Original-SemVer-Namen ablegen (Dateiname bleibt)
          cp "$APPIMAGE_SRC" "dist/arch-build/webradio-${SEMVER}.AppImage"
          chmod +x "dist/arch-build/webradio-${SEMVER}.AppImage"

          cp assets/webradio.desktop dist/arch-build/
          cp assets/icons/tray.png dist/arch-build/

          cd dist/arch-build

          # Checksums berechnen
          APP_SHA="$(sha256sum "webradio-${SEMVER}.AppImage" | awk '{print $1}')"
          DESK_SHA="$(sha256sum webradio.desktop | awk '{print $1}')"
          ICON_SHA="$(sha256sum tray.png | awk '{print $1}')"

          # PKGBUILD aus Template rendern
          # __PKGVER__ = Arch-kompatible Version (ohne Bindestrich)
          # __SEMVER__  = Original SemVer (für Dateinamen und pkgdesc)
          sed \
            -e "s|__PKGVER__|${PKGVER_ARCH}|g" \
            -e "s|__SEMVER__|${SEMVER}|g" \
            -e "s|__APPIMAGE_SHA256__|${APP_SHA}|g" \
            -e "s|__DESKTOP_SHA256__|${DESK_SHA}|g" \
            -e "s|__ICON_SHA256__|${ICON_SHA}|g" \
            ../../packaging/arch/PKGBUILD \
            > PKGBUILD

          echo "--- PKGBUILD (head) ---"
          head -n 45 PKGBUILD

          # makepkg benötigt die Source-Dateien im selben Verzeichnis.
          # (PKGBUILD referenziert sie ohne file://, d.h. makepkg sucht
          #  sie im SRCDEST = Arbeitsverzeichnis des Containers)
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash -lc "
              set -euo pipefail
              pacman -Syyu --noconfirm base-devel fakeroot squashfs-tools unzip
              useradd -m builder 2>/dev/null || true
              chown -R builder:builder /work
              # --nodeps: Runtime-Abhaengigkeiten muessen im Container NICHT installiert
              # sein (sie sind fuer das Zielsystem). makepkg kopiert die lokalen
              # Source-Dateien aus /work in srcdir und baut das Paket.
              su - builder -c 'cd /work && SRCDEST=/work makepkg --nodeps --noconfirm'
            "

      - name: Prepare Linux Artifacts
        run: |
          mkdir -p release-artifacts

          # AppImage + Metadaten aus dist/
          find dist -maxdepth 1 -type f \( \
            -name "*.AppImage" \
            -o -name "*.blockmap" \
            -o -name "latest*.yml" \
            -o -name "beta*.yml" \
            -o -name "alpha*.yml" \
            -o -name "latest*.json" \
            -o -name "beta*.json" \
            -o -name "alpha*.json" \
            -o -name "*.txt" \
          \) ! -name "SHA256SUMS.txt" | while read f; do
            cp "$f" release-artifacts/
            echo "  Kopiert: $(basename "$f")"
          done

          # Arch-Paket
          find dist/arch-build -maxdepth 1 -name "*.pkg.tar.zst" | while read f; do
            cp "$f" release-artifacts/
            echo "  Kopiert: $(basename "$f")"
          done

          echo ""
          echo "Linux Artefakte:"
          ls -lh release-artifacts/

      - name: Validate Linux Artifacts
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=( release-artifacts/* )
          shopt -u nullglob

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Keine Linux Release-Artefakte gefunden."
            exit 1
          fi

          found_appimage=false
          found_pkg=false
          found_yml=false

          for f in "${files[@]}"; do
            case "$f" in
              *.AppImage) found_appimage=true ;;
              *.pkg.tar.zst) found_pkg=true ;;
              *.yml|*.yaml) found_yml=true ;;
            esac
          done

          if [ "$found_appimage" = false ]; then
            echo "::error::AppImage nicht gefunden."
            exit 1
          fi

          if [ "$found_pkg" = false ]; then
            echo "::warning::Arch Linux Paket (.pkg.tar.zst) nicht gefunden."
          fi

          if [ "$found_yml" = false ]; then
            echo "::warning::Keine Update-YAML-Dateien gefunden."
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-artifacts/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4: Release Notes erzeugen
  # ───────────────────────────────────────────────────────────────────────────
  release-notes:
    name: Generate Release Notes
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Release Notes
        env:
          RELEASE_VERSION: ${{ needs.context.outputs.release_version }}
        run: |
          node -e "
            const fs = require('fs');
            const releaseNotes = require('./scripts/release/release-notes');
            const notes = releaseNotes.generate(process.env.RELEASE_VERSION);
            fs.writeFileSync('release-notes.md', notes, 'utf8');
            console.log('Release Notes erzeugt fuer Version ' + process.env.RELEASE_VERSION);
          "

      - name: Validate Release Notes Artifact
        run: |
          if [ ! -f release-notes.md ]; then
            echo "::error::release-notes.md wurde nicht erzeugt."
            exit 1
          fi

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Job 5: GitHub Release veröffentlichen
  #
  # Wartet auf beide Build-Jobs und die Release-Notes.
  # Ladet alle Artefakte (Windows + Linux) in denselben GitHub-Release hoch.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [context, build-windows, build-linux, release-notes]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-artifacts

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-artifacts

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Validate Release Artifacts Exist
        run: |
          set -euo pipefail

          if [ ! -d release-artifacts ]; then
            echo "::error::release-artifacts-Verzeichnis fehlt."
            exit 1
          fi

          shopt -s nullglob
          files=( release-artifacts/* )
          shopt -u nullglob

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Keine Release-Artefakte vorhanden."
            exit 1
          fi

          echo "Alle Artefakte für den Release:"
          ls -lh release-artifacts/

      - name: Generate Final Checksums
        shell: bash
        run: |
          set -euo pipefail

          cd release-artifacts

          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS.txt' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

          echo "SHA256SUMS.txt generiert:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ needs.context.outputs.release_tag }}
          name:                   WebRadio ${{ needs.context.outputs.release_version }}
          body_path:              release-notes.md
          prerelease:             ${{ needs.context.outputs.is_prerelease }}
          draft:                  ${{ inputs.draft == 'true' }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}