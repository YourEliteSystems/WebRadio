name: Prepare safe dependency audit fixes

on:
  push:
    branches:
      - feature/dependency-audit-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-fix:
    if: "!contains(github.event.head_commit.message, '[audit-bot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Apply non-forced npm audit fixes
        # npm audit fix can update compatible packages and still exit non-zero
        # when fix-only-with-breaking-changes advisories remain.
        continue-on-error: true
        run: npm audit fix

      - name: Commit lockfile changes to this branch
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible dependency updates were produced."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(deps): apply compatible audit fixes [audit-bot]"
            git push
          fi

      - name: Run project tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Verify renderer build
        run: npm run build

      - name: Report remaining vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=high
