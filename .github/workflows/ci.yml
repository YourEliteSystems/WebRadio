name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [26.x]

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Report-only while existing findings are triaged; make this blocking after remediation.
      - name: Audit Dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Install xvfb and Electron system libraries (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1
          # Ubuntu 24.04+ uses libasound2t64 instead of libasound2
          sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64

      - name: Run Electron Splash Smoke Test
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:splash:electron

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: webradio-build
          path: renderer/dist/