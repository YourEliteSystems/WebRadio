name: Build WebRadio

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: React Build
        run: npm run build-react

      - name: Electron Builder Verzeichnis-Test
        run: npx electron-builder --dir

  linux-package:
    # Baut AppImage und Arch-Paket (siehe .github/workflows/build-linux.yml).
    # Läuft nur auf Push / main, develop – auf PRs übernimmt das den Smoke-Test.
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/build-linux.yml
    with:
      # keine Inputs – das gerufene Workflow läuft mit seinen Defaults
