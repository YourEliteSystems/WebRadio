appId: de.yourelitesystems.webradio
productName: WebRadio

directories:
  output: dist

files:
  - electron/**/*
  - renderer/**/*
  - plugins/**/*
  - themes/**/*
  - assets/**/*
  - package.json
  - app-update.yml

extraResources:
  - from: themes
    to: themes

  - from: plugins
    to: plugins

  - from: app-update.yml
    to: app-update.yml

asar: true

# ──────────────────────────────────────────────────────────────────
# Update System v1 (electron-updater / GitHub Releases)
#
# Erzeugt je nach Git-Tag Stable- oder Beta-Update-Metadaten
# (latest*.yml / beta*.yml). Der aktive Kanal ("latest" / "beta")
# wird NICHT hier gesetzt, sondern zur Laufzeit durch UpdateChannel.js
# via autoUpdater.channel bestimmt.
#
# generateUpdatesFilesForAllChannels sorgt dafür, dass für jedes
# Target die plattform-spezifischen Metadaten beider Kanäle erzeugt
# werden (latest.yml, beta.yml, latest-linux.yml …), damit der
# Updater ohne Rate-Limits und ohne User-Eingriff arbeiten kann.
# ──────────────────────────────────────────────────────────────────
publish:
  - provider: github
    releaseType: release
    useMultipleRangeRequest: false

generateUpdatesFilesForAllChannels: true

# FFmpeg ist eine native Binary und kann nicht aus ASAR heraus
# ausgeführt werden. Wir entpacken nur den FFmpeg-Binary aus
# ffmpeg-static (das unter Linux x64 ein ELF liefert).
# Hinweis: discord-rpc ist reines JavaScript (nutzt WebSockets),
# daher KEIN asarUnpack-Eintrag notwendig. register-scheme (transitive
# Dep von discord-rpc) enthält eine .node-Binary; sie wird durch die
# Standard-Regel `**/*.node` automatisch von electron-builder entpackt.
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/*.node"

compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

  icon: assets/icons/tray.ico

# ──────────────────────────────────────────────────────────────────
# Linux x86_64 / amd64
#
# Primäre Targets:
#   • AppImage – universelles, ausführbares Binary
#   • deb      – Debian / Ubuntu (vorbereitet, optional)
#
# Arch-Pakete (.pkg.tar.zst) werden NICHT direkt von electron-builder
# erzeugt. Stattdessen wird das fertige AppImage in einem
# Arch-Linux-Container in einen echten pacman-Build überführt
# (siehe .github/workflows/build-linux.yml → "arch-package" Job).
# ──────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

  # Synchronisiere den in package.json gesetzten desktopName automatisch
  # in die generierte .desktop-Datei. Damit passt der StartupWMClass zum
  # Electron-WM_CLASS und das Fenster wird vom Desktop (GNOME/KDE/XFCE)
  # korrekt dem Launcher zugeordnet.
  # https://www.electron.build/linux#window-association-desktopname--syncdesktopname
  syncDesktopName: true

  category: AudioVideo

  synopsis: Modern desktop radio player
  description: |
    WebRadio is a modern, extensible desktop radio player built with
    Electron and React. It features a plugin system, theme engine,
    and FFmpeg-based stream decoding for thousands of online radio
    stations from the Radio Browser API.

  desktop:
    entry:
      Name: WebRadio
      Comment: Modern Desktop Radio Player with Plugin System
      Categories: AudioVideo;Audio;Player;Network;
      Keywords: radio;player;stream;audio;webradio;
      Terminal: "false"
      StartupNotify: "true"
      StartupWMClass: WebRadio
      Type: Application

  # Icons: electron-builder erzeugt aus assets/icons/tray.png
  # automatisch die Standard-Hicon-Größen.
  icon: assets/icons/tray.png

  mimeTypes:
    - x-scheme-handler/webradio

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icons/tray.icns
  category: public.app-category.music

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"