appId: de.yourelitesystems.webradio
productName: WebRadio

directories:
  output: dist

files:
  - electron/**/*
  - renderer/**/*
  - plugins/**/*
  - themes/**/*
  - assets/**/*
  - package.json

extraResources:
  - from: themes
    to: themes

  - from: plugins
    to: plugins

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

  icon: assets/icons/tray.ico

linux:
  target:
    - AppImage
    - deb

  category: AudioVideo

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icons/tray.icns
  category: public.app-category.music

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

asar: true

compression: normal