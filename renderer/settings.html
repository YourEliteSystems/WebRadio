<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src *; img-src *;">
  <title>WebRadio – Einstellungen</title>
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/core.css">
  <link rel="stylesheet" id="theme-style">
  <style>
    /* ── Settings-spezifische Styles ── */
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 70% -10%, rgba(99, 102, 241, 0.12), transparent 55%);
      margin: 0;
      padding: 0;
    }

    .settings-main-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: calc(100vh - 42px);
      overflow: hidden;
    }

    .settings-layout {
      display: flex;
      flex: 1;
      min-height: 0;
      height: 100%;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* Linke Nav */
    .settings-nav {
      width: 200px;
      background: var(--bg-sidebar);
      backdrop-filter: blur(10px);
      border-right: var(--glass-border);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .settings-nav-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 8px 12px 4px;
      font-weight: 600;
    }

    .settings-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      transition: var(--transition);
    }

    .settings-nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .settings-nav-item.active {
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent-color);
    }

    .settings-nav-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Rechte Inhaltsbereich */
    .settings-content {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
      min-height: 0;
      height: 100%;
    }

    .settings-page {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .settings-page-header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: var(--glass-border);
    }

    .settings-page-header h1 {
      font-size: 22px;
      margin: 0 0 4px;
      background: linear-gradient(to right, #fff, var(--text-muted));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .settings-page-header p {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Karten */
    .settings-card {
      background: var(--bg-card);
      border: var(--glass-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .settings-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .settings-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      margin: 0;
    }

    /* Plugin Item */
    .plugin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.2);
      border: var(--glass-border);
      border-radius: 8px;
      margin-bottom: 8px;
      transition: var(--transition);
    }

    .plugin-item:hover {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .plugin-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .plugin-item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    /* Toggle Switch */
    .toggle-wrap {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle-wrap input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 34px;
      cursor: pointer;
      transition: var(--transition);
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: var(--transition);
    }

    .toggle-wrap input:checked+.toggle-slider {
      background: var(--accent-color);
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.5);
    }

    .toggle-wrap input:checked+.toggle-slider::before {
      transform: translateX(18px);
    }

    /* Theme Karten */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .theme-card {
      padding: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .theme-card:hover {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .theme-card.active {
      border-color: var(--accent-color);
      background: rgba(99, 102, 241, 0.1);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
    }

    .theme-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-color);
      flex-shrink: 0;
    }

    /* Update Sektion */
    .update-status-box {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
      border: var(--glass-border);
      margin-bottom: 16px;
    }

    .update-status-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .update-status-icon.current {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .update-status-icon.available {
      background: rgba(99, 102, 241, 0.2);
      color: var(--accent-color);
      animation: pulseGlow 2s infinite;
    }

    .update-status-icon.checking {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .update-status-icon.downloaded {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .update-status-icon.error {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .update-status-icon.idle {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(99, 102, 241, 0);
      }
    }

    .update-status-text strong {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
    }

    .update-status-text span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .update-release-notes {
      background: rgba(0, 0, 0, 0.25);
      border: var(--glass-border);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      white-space: pre-line;
      margin-bottom: 16px;
      max-height: 120px;
      overflow-y: auto;
    }

    .update-actions {
      display: flex;
      gap: 10px;
    }

    .btn-update {
      padding: 10px 20px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .btn-update:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* Version Info am Boden */
    .version-info {
      margin-top: 24px;
      padding-top: 16px;
      border-top: var(--glass-border);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Channel Badge */
    .channel-badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.18);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.35);
      vertical-align: middle;
    }

    .channel-badge.beta {
      background: rgba(245, 158, 11, 0.18);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.35);
    }

    /* Channel-Auswahl Radio-Karten */
    .channel-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .channel-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
    }

    .channel-option:hover {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .channel-option input[type="radio"] {
      margin-top: 4px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .channel-option.selected {
      border-color: var(--accent-color);
      background: rgba(99, 102, 241, 0.10);
      box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.25) inset;
    }

    .channel-option-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .channel-option-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .channel-option-desc strong {
      color: #f59e0b;
    }

    .beta-hint {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.30);
      color: #f59e0b;
      font-size: 12px;
    }

    .beta-hint svg {
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Modal (Beta-Warnung) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 460px;
      max-width: 90vw;
      background: var(--bg-card);
      border: var(--glass-border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }

    .modal h2 {
      margin: 0 0 12px;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal p {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-main);
    }

    .modal .modal-warning {
      background: rgba(245, 158, 11, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.30);
      border-radius: 8px;
      padding: 10px 12px;
      color: #f59e0b;
      font-size: 12px;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-primary {
      padding: 8px 18px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary.danger {
      background: #f59e0b;
    }

    .btn-primary.danger:hover {
      background: #ea8909;
    }

    .btn-secondary {
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:disabled,
    .btn-primary:disabled,
    .btn-update:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /*Diagnostics */
    .health-check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0,0,0,0.15);
      margin-bottom: 6px;
      font-size: 13px;
    }

    .health-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .health-dot.ok   { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.5); }
    .health-dot.fail { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.5); }

    .sysinfo-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .sysinfo-table td {
      padding: 7px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .sysinfo-table td:first-child {
      color: var(--text-muted);
      width: 45%;
      font-weight: 500;
    }

    .crash-report-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(0,0,0,0.2);
      border: var(--glass-border);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      gap: 10px;
    }

    .crash-report-name {
      font-family: monospace;
      color: var(--text-muted);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .crash-report-date {
      color: var(--text-muted);
      font-size: 11px;
      flex-shrink: 0;
    }

    .btn-icon-sm {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 12px;
      line-height: 1;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .btn-icon-sm:hover {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
      border-color: rgba(239,68,68,0.3);
    }

    .diag-open-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .diag-open-btn:hover {
      background: rgba(99,102,241,0.12);
      border-color: rgba(99,102,241,0.3);
      color: var(--accent-color);
    }

    .diag-folder-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <!-- React Root Container -->
  <div id="settings-root"></div>

  <!-- Settings JS (gebündelt) -->
  <script src="dist/settings.js"></script>

</body>

</html>
