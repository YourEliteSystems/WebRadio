# MkDocs configuration for WebRadio.
# Documentation source: docs/ (Single Source of Truth)
# Build locally: mkdocs build --strict
# Serve locally:  mkdocs serve
# Versioned docs: Managed by ReadTheDocs (based on Git tags/branches)

site_name: WebRadio
site_description: Quelloffene Webradio-Desktopanwendung für Windows und Linux, entwickelt mit Electron und React.
site_url: https://webradio.readthedocs.io/
repo_url: https://github.com/YourEliteSystems/WebRadio
repo_name: YourEliteSystems/WebRadio
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Never publish local-only files: the internal strategy document is excluded
# from version control (.gitignore) and the requirements file is build tooling.
exclude_docs: |
  internal/
  requirements.txt

# Versioning is managed by ReadTheDocs - see .readthedocs.yaml
# The version selector will be automatically added by ReadTheDocs

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Zum dunklen Design wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Zum hellen Design wechseln

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# Navigation is built exclusively from files that exist in docs/.
# Missing pages are not linked anywhere.
nav:
  - Startseite: index.md
  - Erste Schritte: Readme.md
  - Architektur:
      - Überblick: architecture/readme.md
      - Architekturleitfaden: architecture.md
      - Anwendung: architecture/01-Application.md
      - Speicherverwaltung: architecture/02-StorageManager.md
      - Fensterverwaltung: architecture/03-WindowManager.md
      - Diagnose: architecture/04-Diagnostics.md
      - Interprozesskommunikation (IPC): architecture/05-IPC.md
      - Theme-Verwaltung: architecture/06-ThemeManager.md
      - Plugin-Verwaltung: architecture/07-PluginManager.md
      - Paketsystem: architecture/11-PackageSystem.md
      - Medientasten: architecture/08-MediaKeys.md
      - Infobereich: architecture/09-Tray.md
      - Aktualisierungen: architecture/10-Updater.md
  - API-Referenz:
      - Überblick: api-reference/README.md
      - Anwendung: api-reference/Application.md
      - Plugin: api-reference/Plugin.md
      - Plugin-Kontext: api-reference/PluginContext.md
      - Plugin-Verwaltung: api-reference/PluginManager.md
      - Theme: api-reference/Theme.md
      - Theme-Verwaltung: api-reference/ThemeManager.md
      - Einstellungen: api-reference/Settings.md
      - Speicher: api-reference/Storage.md
      - Ereignisse: api-reference/Events.md
      - Hooks: api-reference/Hooks.md
      - Befehle: api-reference/Commands.md
      - Menüs: api-reference/Menus.md
      - Benachrichtigungen: api-reference/Notifications.md
      - Berechtigungen: api-reference/Permissions.md
      - Fenster: api-reference/Windows.md
      - Stream-Verwaltung: api-reference/StreamManager.md
      - Einheitlicher Player: api-reference/UnifiedPlayer.md
      - RadioBrowserService: api-reference/RadioBrowserService.md
      - Protokollierung: api-reference/Logger.md
  - Plugin-SDK:
      - Überblick: plugin-sdk/README.md
      - Erste Schritte: plugin-sdk/01-GettingStarted.md
      - Plugin-Manifest: plugin-sdk/02-Manifest.md
      - Projektstruktur: plugin-sdk/03-ProjectStructure.md
      - Plugin-Lebenszyklus: plugin-sdk/04-Lifecycle.md
      - Plugin-Kontext: plugin-sdk/05-Context.md
      - Plugin-API: plugin-sdk/06-PluginAPI.md
      - Speicher: plugin-sdk/06-Storage.md
      - Ereignisse: plugin-sdk/07-Events.md
      - Hooks: plugin-sdk/08-Hooks.md
      - Navigationserweiterungs-API: plugin-sdk/08-Navigation.md
      - UI-Integration: plugin-sdk/09-UI.md
      - Bewährte Vorgehensweisen: plugin-sdk/10-BestPractices.md
      - Hallo Welt: plugin-sdk/11-HelloWorld.md
      - Häufige Fragen (FAQ): plugin-sdk/12-FAQ.md
      - Fähigkeiten und Plugin-HTTP: plugin-sdk/13-Capabilities.md
  - Theme-SDK:
      - Überblick: theme-sdk/README.md
      - Erste Schritte: theme-sdk/01-GettingStarted.md
      - Theme-Manifest: theme-sdk/02-ThemeManifest.md
      - Verzeichnisstruktur: theme-sdk/03-DirectoryStructure.md
      - CSS-Variablen: theme-sdk/04-CSSVariables.md
      - Komponenten: theme-sdk/05-Components.md
      - Assets: theme-sdk/06-Assets.md
      - Bewährte Vorgehensweisen: theme-sdk/07-BestPractices.md
      - Hallo Theme: theme-sdk/08-HelloTheme.md
      - Häufige Fragen (FAQ): theme-sdk/09-FAQ.md
  - Integrationen:
      - Integrations-SDK: IntegrationSDK.md
      - Geprüfte Integrationen: VERIFIED_INTEGRATIONS.md
  - Aktualisierungen:
      - Aktualisierungsarchitektur: UPDATE_ARCHITECTURE.md
  - Plattformübergreifende Einrichtung:
      - Einrichtung auf mehreren Plattformen: CROSS_PLATFORM_SETUP.md
  - Projektregeln:
      - Verhaltenskodex: CODE_OF_CONDUCT.md
      - Mitwirken: CONTRIBUTING.md
      - Sicherheitsrichtlinie: SECURITY.md
      - Bedrohungsmodell: THREAT_MODEL.md
  - Dokumentation:
      - Übersetzungsplan: TRANSLATION_PLAN.md
      - Versionierung: VERSIONING.md
      - Download-Statistik: DOWNLOAD_STATS.md
  - Datenschutz:
      - Datenschutz: PRIVACY.md
      - Drittanbieter-Komponenten: THIRD_PARTY_NOTICES.md

# Warn (and fail under `mkdocs build --strict`) about broken links or
# navigation entries that do not point to a real file. Nothing is silenced.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
