# Read the Docs configuration file for WebRadio.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Pipeline:
#   GitHub (YourEliteSystems/WebRadio, Branch "main")
#     -> docs/  (Single Source of Truth)
#       -> Read the Docs (MkDocs build)

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
